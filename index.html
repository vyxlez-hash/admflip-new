<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADMFLIP</title>

<link rel="icon" href="logo.png">

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- MAINTENANCE SCREEN -->

<div id="maintenance" class="maintenance hidden">

    <h1>ADMFLIP</h1>

    <h2>⚠️ Site Under Maintenance</h2>

    <p>
        Please come back later.
    </p>

</div>





<!-- ANNOUNCEMENT -->

<div id="announcement" class="announcement hidden">

</div>





<!-- MAIN SITE -->

<div id="site">


<header class="header">


<div class="brand">

<img src="logo.png">

</div>



<nav class="menu">

<a href="#">
Coinflip
</a>

<a href="#">
Leaderboard
</a>

<a href="#">
Chat
</a>

</nav>




<div class="account-buttons">


<button class="login" id="loginBtn">

<img src="roblox.png">

<span>
Sign In
</span>

</button>



<button class="logout" id="logoutBtn" style="display:none;">

Log Out

</button>


</div>


</header>






<div class="modal" id="modal">


<div class="box">


<h2>
Roblox Sign In
</h2>



<input 
id="username"
placeholder="Roblox username"
autocomplete="off"
/>




<div id="profile" class="hidden"></div>



<div id="phrase" class="hidden"></div>





<button id="verify" style="display:none;">

Verify

</button>



</div>


</div>


</div>




<script src="script.js"></script>


</body>

</html>
