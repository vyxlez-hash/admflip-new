<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADMFLIP</title>

<link rel="icon" href="logo.png">

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">


<div class="brand">

<img src="logo.png">

</div>



<nav class="menu">

<a href="#">
Coinflip
</a>


<a href="#">
Leaderboard
</a>


<a href="#">
Chat
</a>


</nav>





<div class="account-buttons">


<button class="login" id="loginBtn">

<img src="roblox.png">

<span>
Sign In
</span>

</button>



<button class="logout" id="logoutBtn" style="display:none;">

Log Out

</button>



</div>



</header>







<div class="modal" id="modal">


<div class="box">


<h2>
Roblox Sign In
</h2>



<input 
id="username"
placeholder="Roblox username"
autocomplete="off"
>



<div id="profile"></div>



<p id="phrase"></p>




<button id="done" style="display:none;">

Done

</button>



<button id="verify" style="display:none;">

Verify Account

</button>



</div>


</div>







<script src="script.js"></script>


</body>

</html>
